<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Skincare - Platform Edukasi & Analisa Kulit</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        
        <!-- 1. HALAMAN UTAMA (HOME) -->
        <div id="home-screen" class="screen active">
            <h1>Belajar Skincare ✨</h1>
            <p class="subtitle">Platform edukasi & analisa kebutuhan kulitmu</p>
            
            <div class="menu-container">
                <button class="menu-btn" onclick="switchScreen('analisa-screen')">🔍 Analisa Kulit</button>
                <button class="menu-btn" onclick="switchScreen('kamus-screen')">📚 Kamus Ingredients</button>
                <button class="menu-btn" onclick="switchScreen('trivia-screen')">🎮 Trivia Skincare</button>
            </div>

            <div class="footer-contacts">
                <a href="https://wa.me/6285640743667" target="_blank">WhatsApp</a> | 
                <a href="https://instagram.com/gigih2glow" target="_blank">Instagram</a> | 
                <a href="mailto:gigihjuang10@gmail.com">Email</a>
            </div>
        </div>

        <!-- 2. HALAMAN ANALISA KULIT -->
        <div id="analisa-screen" class="screen">
            <button class="back-btn" onclick="switchScreen('home-screen')">⬅ Kembali</button>
            <h2>Analisa Kulit Kamu</h2>
            <div id="analisa-container"></div>
        </div>

        <!-- 3. HALAMAN KAMUS INGREDIENTS -->
        <div id="kamus-screen" class="screen">
            <button class="back-btn" onclick="switchScreen('home-screen')">⬅ Kembali</button>
            <h2>Kamus Ingredients</h2>
            <p style="font-size: 13px; text-align: center; color: #666;">Pilih jenis permasalahan kulit untuk mempelajari bahan yang cocok:</p>
            
            <div class="category-grid" id="kamus-problem-buttons"></div>
            <div id="ingredients-list" class="ingredients-grid"></div>
        </div>

        <!-- 4. HALAMAN TRIVIA SKINCARE -->
        <div id="trivia-screen" class="screen">
            <button class="back-btn" onclick="switchScreen('home-screen')">⬅ Kembali</button>
            <div id="trivia-container"></div>
        </div>

    </div>

    <!-- MODAL / POP-UP DETAIL INGREDIENT & PRODUK -->
    <div id="app-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modal-details"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
